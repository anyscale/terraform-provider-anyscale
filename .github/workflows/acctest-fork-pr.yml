name: Fork PR credentialed acctests

# GitHub withholds Actions secrets from pull requests opened from forks, so on
# a fork PR ci.yml runs only the hermetic acceptance tests and reports every
# test that needs credentials as SKIP(no-credentials). This workflow is how a
# maintainer runs those tests: after reviewing the PR's diff, dispatch it from
# main with the PR number and the full head SHA that was reviewed. It runs both
# acctest shards against exactly that SHA with the real token, then posts the
# 'credentialed-acctests' commit status on it.
#
# The fork's code runs with ANYSCALE_CLI_TOKEN in its environment. Review the
# diff (go.mod, Makefile, internal/acctest helpers and .github in particular)
# before dispatching, and dispatch again after any new push: a status is only
# ever posted for the SHA that was dispatched, and only while it is still the
# PR head.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string
      sha:
        description: "Full 40-character head commit SHA that was reviewed"
        required: true
        type: string

permissions: {}

concurrency:
  group: acctest-fork-pr-${{ inputs.pr_number }}
  # Real cloud infra is created; a hard cancel skips test cleanup.
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Verify dispatch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch this workflow from main (got ${WORKFLOW_REF})."
            exit 1
          fi
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be the full 40-character lowercase commit SHA."
            exit 1
          fi
          pr=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          state=$(jq -r 'if .state == null then "" else .state end' <<<"$pr")
          head_sha=$(jq -r 'if .head.sha == null then "" else .head.sha end' <<<"$pr")
          head_repo=$(jq -r 'if .head.repo == null or .head.repo.full_name == null then "" else .head.repo.full_name end' <<<"$pr")
          if [ "$state" != "open" ]; then
            echo "::error::PR #${PR_NUMBER} is not open (state: ${state:-missing})."
            exit 1
          fi
          if [ -z "$head_repo" ]; then
            echo "::error::PR #${PR_NUMBER} has no head repository (the fork was deleted); its code cannot be verified."
            exit 1
          fi
          if [ "$head_repo" = "$REPO" ]; then
            echo "::error::PR #${PR_NUMBER} is not from a fork; ci.yml already runs its credentialed acctests."
            exit 1
          fi
          if [ "$head_sha" != "$SHA" ]; then
            echo "::error::PR #${PR_NUMBER} head is ${head_sha:-missing}, not ${SHA}. Review the new head and dispatch again with its SHA."
            exit 1
          fi
          echo "Verified: PR #${PR_NUMBER} from ${head_repo} is open at ${SHA}."

  acctest:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: acctest-fork-pr
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [acctest-data, acctest-resource]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Setup Terraform
        # Keep in sync with ci.yml's Setup Terraform step.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false

      # Both steps below mirror ci.yml's "Acceptance Tests - Data Sources" /
      # "Acceptance Tests - Resources" steps. If the go test invocation (flags,
      # timeout, filter regex) changes there, mirror it here by hand.
      - name: Acceptance Tests - Data Sources
        if: matrix.shard == 'acctest-data'
        env:
          ANYSCALE_CLI_TOKEN: ${{ secrets.ANYSCALE_CLI_TOKEN }}
          ANYSCALE_TEST_CREATE_CLOUD: 1
        run: |
          set -o pipefail
          TF_ACC=1 go test ./internal/acctest/ -v -timeout 20m -parallel 4 -run '^TestAcc[A-Za-z]+DataSource' 2>&1 | tee /tmp/acctest.log
          .github/scripts/summarize-acctest-skips.sh /tmp/acctest.log "Acceptance Tests - Data Sources"

      - name: Acceptance Tests - Resources
        if: matrix.shard == 'acctest-resource'
        env:
          ANYSCALE_CLI_TOKEN: ${{ secrets.ANYSCALE_CLI_TOKEN }}
          ANYSCALE_TEST_CREATE_CLOUD: 1
        run: |
          set -o pipefail
          TF_ACC=1 go test ./internal/acctest/ -v -timeout 20m -parallel 4 -run '^TestAcc[A-Za-z]+Resource' 2>&1 | tee /tmp/acctest.log
          .github/scripts/summarize-acctest-skips.sh /tmp/acctest.log "Acceptance Tests - Resources"
          .github/scripts/summarize-compute-config-coverage.sh /tmp/acctest.log "Acceptance Tests - Resources"

  report:
    needs: [verify, acctest]
    # Runs when verify passed, whatever the acctest outcome, so a failed or
    # cancelled run still posts failure. Never posts for an unverified SHA.
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
      pull-requests: read
    steps:
      - name: Post credentialed-acctests status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SHA: ${{ inputs.sha }}
          ACCTEST_RESULT: ${{ needs.acctest.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          head_sha=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq 'if .head.sha == null then "" else .head.sha end')
          if [ "$head_sha" != "$SHA" ]; then
            echo "::error::PR head moved; re-run for the new SHA (head is ${head_sha:-missing}, this run tested ${SHA}). No status posted."
            exit 1
          fi
          if [ "$ACCTEST_RESULT" = "success" ]; then
            state=success
            description="Credentialed acctests passed (maintainer run)"
          else
            state=failure
            description="Credentialed acctests ${ACCTEST_RESULT} (maintainer run)"
          fi
          gh api --method POST "repos/${REPO}/statuses/${SHA}" \
            -f state="$state" \
            -f context=credentialed-acctests \
            -f description="$description" \
            -f target_url="$RUN_URL" >/dev/null
          echo "Posted credentialed-acctests=${state} on ${SHA}."
          if [ "$state" != "success" ]; then
            exit 1
          fi
