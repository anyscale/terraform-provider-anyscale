name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # needed by dorny/paths-filter (docs-only acctest skip)

# Cancel a stale in-progress run when a newer commit supersedes it (a PR gets
# a follow-up push, or a second merge lands on main before the first run
# finishes) -- same pattern release-preflight.yml already uses (verified live
# on this PR by pushing a rapid follow-up commit). A cancelled
# real-infra acctest run can leave a resource behind mid-creation; sweep.yml's
# daily sweeper (gated by ANYSCALE_SWEEP_MIN_AGE) already exists to catch
# exactly that class of leak, so this is an accepted tradeoff, not a new risk.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Declared access mode of the shared test organization: legacy or converted
# (see internal/acctest/org_mode_test.go). When the organization converts to
# role bindings, set the ANYSCALE_TEST_ORG_MODE repository variable to
# "converted"; tests that need the other mode then skip with a reason.
env:
  ANYSCALE_TEST_ORG_MODE: ${{ vars.ANYSCALE_TEST_ORG_MODE || 'legacy' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [lint-and-unit, acctest-data, acctest-resource]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect docs-only diff
        # Lets the two real-infra acctest steps below skip when nothing in
        # the diff could possibly regress provider behavior (verified: the
        # acctest package never reads any file under examples/ - it builds
        # its own Config values from Go string literals per test). Runs as a
        # plain step in this same job/shard, not a separate job gating this
        # one, so the ci (acctest-data)/ci (acctest-resource) required status
        # checks always execute and report - only the expensive step inside
        # them short-circuits. predicate-quantifier: every is required here:
        # the default (some) answers "did any file touch docs", the wrong
        # question - every, combined with '**' plus the negated excludes
        # below, answers "did every file land outside all docs-ish paths",
        # which is what requiresFullAcctest actually needs to mean. Anything
        # not explicitly excluded (e.g. a bare .golangci.yml tweak) fails safe
        # toward requiresFullAcctest == true.
        id: diff-scope
        if: matrix.shard == 'acctest-data' || matrix.shard == 'acctest-resource'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            requiresFullAcctest:
              - '**'
              - '!docs/**'
              - '!examples/**'
              - '!**/*.md'
              - '!.changelog/**'
              - '!templates/**'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Changelog build idempotency check
        if: matrix.shard == 'lint-and-unit'
        run: |
          SCRATCH_FRAGMENT=".changelog/ci-idempotency-smoke-test.txt"
          printf '```\nrelease-note:added\nprovider: CI idempotency smoke-test fragment, not a real change.\n```\n' > "$SCRATCH_FRAGMENT"
          make changelog-build
          cp CHANGELOG.md /tmp/changelog-first-fold.md
          make changelog-build
          if ! diff -u /tmp/changelog-first-fold.md CHANGELOG.md; then
            echo "::error::make changelog-build is not idempotent -- running it twice produced different output"
            exit 1
          fi
          git checkout -- CHANGELOG.md
          rm -f "$SCRATCH_FRAGMENT"

      - name: Setup Terraform
        # Pinned >= 1.15.0: that release fixed how `terraform init` handles a
        # dev_overrides-active provider whose source has no real registry
        # presence (our case below) -- pre-1.15 versions hard-fail querying
        # the registry for it instead of skipping the query. Pinning to the
        # latest stable rather than the bisected floor (1.15.0) deliberately,
        # per team review. This version applies to every shard in this job's
        # matrix, including acctest-data/acctest-resource, not just
        # lint-and-unit -- verified those two stay green before landing this.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false

      - name: Install golangci-lint
        if: matrix.shard == 'lint-and-unit'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Install TFLint
        if: matrix.shard == 'lint-and-unit'
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Format
        if: matrix.shard == 'lint-and-unit'
        run: |
          make fmt
          git diff --exit-code || (echo "Code is not formatted. Run 'make fmt' locally." && exit 1)

      - name: Vet
        if: matrix.shard == 'lint-and-unit'
        run: make vet

      - name: Generate Docs
        if: matrix.shard == 'lint-and-unit'
        run: |
          make docs
          git diff --exit-code || (echo "Docs are out of date. Run 'make docs' locally." && exit 1)

      - name: Validate Docs
        # Distinct from Generate Docs above: that step proves docs/ is
        # regenerated and non-stale relative to templates+schema; this runs
        # `tfplugindocs validate` (via `make docs-validate`), a separate
        # tfplugindocs subcommand that checks doc structure/consistency
        # (e.g. every resource/data source has a page). Neither subsumes the
        # other.
        if: matrix.shard == 'lint-and-unit'
        run: make docs-validate

      - name: Test
        if: matrix.shard == 'lint-and-unit'
        run: make test

      - name: Vulnerability check
        if: matrix.shard == 'lint-and-unit'
        # Fails only when the code calls a vulnerable symbol; findings in
        # modules the code does not call are reported but do not fail. Pinned so
        # a new govulncheck release cannot change the result of an unchanged PR.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: tools/docsgen go directive not below root
        if: matrix.shard == 'lint-and-unit'
        # A Go bump in the root go.mod must also raise tools/docsgen, or the
        # docs tool is left on an older Go. docsgen ahead of root is fine (a
        # dependency there can require a newer Go on its own).
        run: |
          set -euo pipefail
          root=$(go mod edit -json go.mod | jq -r .Go)
          docsgen=$(go mod edit -json tools/docsgen/go.mod | jq -r .Go)
          lowest=$(printf '%s\n' "$root" "$docsgen" | sort -V | head -n1)
          if [ "$lowest" != "$root" ]; then
            echo "tools/docsgen/go.mod go $docsgen is below go.mod go $root; raise it with: go -C tools/docsgen mod edit -go=$root" >&2
            exit 1
          fi

      - name: Vulnerability check (tools/docsgen)
        if: matrix.shard == 'lint-and-unit'
        # tools/docsgen is a separate module (it pins tfplugindocs for `make
        # docs`), so `./...` above never scans it. Scanned against the tool
        # package because the module has no packages of its own.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -C tools/docsgen github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs

      - name: Validate Examples
        if: matrix.shard == 'lint-and-unit'
        # The actual fmt / tflint / init+validate work lives in `make
        # validate-examples` so local and CI runs share one implementation
        # (this step used to hand-roll its own init+validate loop, which
        # never ran terraform fmt or tflint at all and selected directories
        # by `[ -f versions.tf ]`, silently skipping examples/data-sources/
        # whose required_providers block lives in main.tf instead).
        #
        # This step runs `terraform init` while dev_overrides is active for the
        # anyscale provider, which CLAUDE.md's local-dev guidance says to avoid
        # ("provider is not in the public registry"). That guidance is about
        # local workflows on whatever Terraform happens to be on a developer's
        # PATH; here the version is pinned above specifically so init resolves
        # this correctly -- on Terraform >= 1.15, init skips registry
        # resolution for a dev-overridden provider entirely (confirmed via the
        # "not installed as part of init since they were overwritten" notice
        # and an empty entry for it in the resulting .terraform.lock.hcl),
        # while still installing the real providers (aws/google/random/etc.)
        # each example also declares -- without those, `terraform validate`
        # would have no schema to check resource blocks against and this gate
        # would pass vacuously. Do not lower the pinned version above without
        # re-verifying this interaction on a clean checkout.
        run: |
          set -euo pipefail
          make build
          override_dir="$(mktemp -d)"
          cp terraform-provider-anyscale "$override_dir/"
          cli_config="$(mktemp)"
          cat > "$cli_config" <<RC
          provider_installation {
            dev_overrides {
              "registry.terraform.io/anyscale/anyscale" = "$override_dir"
            }
            direct {}
          }
          RC
          export TF_CLI_CONFIG_FILE="$cli_config"
          make validate-examples

      - name: Detect withheld credentials
        # GitHub withholds Actions secrets from fork PRs and Dependabot runs, so
        # ANYSCALE_CLI_TOKEN is empty there. On those runs the acctest steps
        # below set ANYSCALE_TEST_CREDENTIALS_WITHHELD=1: hermetic tests still
        # run, and every test that needs credentials reports
        # SKIP(no-credentials) instead of failing. Never set on push, schedule,
        # or a same-repo PR. A missing head repo (deleted fork) counts as a fork.
        # A maintainer runs the skipped tests on a fork PR with the 'Fork PR
        # credentialed acctests' workflow (acctest-fork-pr.yml).
        id: creds
        if: matrix.shard == 'acctest-data' || matrix.shard == 'acctest-resource'
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          withheld=false
          reason=none
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            withheld=true
            reason=fork
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$ACTOR" = "dependabot[bot]" ]; then
            withheld=true
            reason=dependabot
          fi
          echo "credentials-withheld=${withheld}, reason=${reason}"
          echo "withheld=${withheld}" >> "$GITHUB_OUTPUT"

      - name: Acceptance Tests - Data Sources
        # Skipped when the diff is docs-only (see "Detect docs-only diff"
        # above and the notice step below). On fork and Dependabot runs it
        # runs in hermetic mode (see "Detect withheld credentials").
        if: matrix.shard == 'acctest-data' && steps.diff-scope.outputs.requiresFullAcctest == 'true'
        env:
          ANYSCALE_CLI_TOKEN: ${{ secrets.ANYSCALE_CLI_TOKEN }}
          ANYSCALE_TEST_CREATE_CLOUD: 1
          CREDENTIALS_WITHHELD: ${{ steps.creds.outputs.withheld }}
        run: |
          set -o pipefail
          if [ "$CREDENTIALS_WITHHELD" = "true" ]; then export ANYSCALE_TEST_CREDENTIALS_WITHHELD=1; fi
          TF_ACC=1 go test ./internal/acctest/ -v -timeout 20m -parallel 4 -run '^TestAcc[A-Za-z]+DataSource' 2>&1 | tee /tmp/acctest.log
          .github/scripts/summarize-acctest-skips.sh /tmp/acctest.log "Acceptance Tests - Data Sources"

      - name: Acceptance Tests - Resources
        # Same docs-only skip and hermetic mode as "Acceptance Tests - Data
        # Sources" above - see that step's comment.
        if: matrix.shard == 'acctest-resource' && steps.diff-scope.outputs.requiresFullAcctest == 'true'
        env:
          ANYSCALE_CLI_TOKEN: ${{ secrets.ANYSCALE_CLI_TOKEN }}
          ANYSCALE_TEST_CREATE_CLOUD: 1
          CREDENTIALS_WITHHELD: ${{ steps.creds.outputs.withheld }}
        run: |
          set -o pipefail
          if [ "$CREDENTIALS_WITHHELD" = "true" ]; then export ANYSCALE_TEST_CREDENTIALS_WITHHELD=1; fi
          TF_ACC=1 go test ./internal/acctest/ -v -timeout 20m -parallel 4 -run '^TestAcc[A-Za-z]+Resource' 2>&1 | tee /tmp/acctest.log
          .github/scripts/summarize-acctest-skips.sh /tmp/acctest.log "Acceptance Tests - Resources"
          .github/scripts/summarize-compute-config-coverage.sh /tmp/acctest.log "Acceptance Tests - Resources"

      - name: Acceptance Tests skipped (docs-only diff)
        # Keeps the acctest-data / acctest-resource required checks green when
        # the acctest steps above skip a docs-only diff, and records why.
        if: (matrix.shard == 'acctest-data' || matrix.shard == 'acctest-resource') && steps.diff-scope.outputs.requiresFullAcctest == 'false'
        run: echo "::notice::Acceptance tests skipped -- every changed file in this diff falls under the docs-only path list (docs/**, examples/**, **/*.md, .changelog/**, templates/**; see this workflow's 'Detect docs-only diff' step). Required check still reports success. Full real-infra acctest coverage resumes on the next PR touching internal/**, main.go, go.mod/go.sum, tools/**, Makefile, or this file -- and also runs unconditionally every day via .github/workflows/scheduled-acctest.yml."
