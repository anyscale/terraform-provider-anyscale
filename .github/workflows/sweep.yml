name: Sweep

on:
  schedule:
    - cron: "0 3 * * *"  # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Fail immediately, to exercise the failure notification (creates or updates the tracking issue)."
        type: boolean
        default: false

permissions:
  contents: read

# A second sweep must queue behind a running one, not cancel it: a hard-cancelled
# sweep leaves the resources it was cleaning up half-deleted.
concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Simulate a failure
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "::error::Simulated failure (workflow_dispatch simulate_failure=true), used to exercise the failure notification."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Setup Terraform
        # Not kept in sync with ci.yml/scheduled-acctest.yml's 1.15.7 pin, and does
        # not need to be: those pin 1.15.0+ because terraform init under
        # dev_overrides 404s for an unpublished provider source below that version
        # (see ci.yml's Setup Terraform step). The sweeper only calls the Anyscale
        # API directly, no plan/apply, so it never hits that path. Aligned to the
        # documented compatibility floor (CLAUDE.md) as of this fix, not because the
        # sweeper needs it -- fine to leave as is or bump independently of the other
        # two files.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Run Sweep
        env:
          ANYSCALE_CLI_TOKEN: ${{ secrets.ANYSCALE_CLI_TOKEN }}
        run: make sweep

  # Opens (or comments on) one tracking issue when the run fails, so a red
  # nightly run is not only an email. The issues: write grant is scoped to this
  # job; the job above keeps read-only permissions.
  notify-failure:
    name: Notify on failure
    needs: sweep
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          ISSUE_TITLE: "Nightly sweep is failing"
        run: |
          set -euo pipefail
          body="Run failed: ${RUN_URL} (trigger: ${EVENT}, commit ${SHA})"
          existing="$(gh issue list --state open --search "in:title \"${ISSUE_TITLE}\"" --json number,title \
            --jq "[.[] | select(.title == \"${ISSUE_TITLE}\")][0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Commented on #$existing"
          else
            gh issue create --title "${ISSUE_TITLE}" --body "$body"
          fi
