name: Credentialed acctests status

# Posts the 'credentialed-acctests' commit status for pull requests whose CI
# run had credentials, so branch protection can require it on every PR:
#
#   - same-repo PR: mirrors the CI run's conclusion (its acctests ran with
#     credentials);
#   - Dependabot PR: success by policy (hermetic acctests only; GitHub
#     withholds Actions secrets from Dependabot runs);
#   - fork PR: nothing. The status stays pending until a maintainer runs
#     acctest-fork-pr.yml for the reviewed head SHA.
#
# Runs on workflow_run so it has statuses: write even when CI ran for a fork.
# It never checks out code or downloads artifacts; it reads only the event's
# metadata.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] metadata-only: no checkout, no artifacts, no code from the triggering run; only statuses: write
    workflows: [CI]
    types: [completed]

permissions:
  statuses: write

jobs:
  status:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post credentialed-acctests status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::workflow_run head_sha is missing or malformed; no status posted."
            exit 1
          fi
          if [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" != "$REPO" ]; then
            echo "Fork PR (head repo: ${HEAD_REPO:-missing}): no status posted; a maintainer runs acctest-fork-pr.yml."
            exit 0
          fi
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            state=success
            description="Dependabot PR: hermetic acctests only (policy)"
          else
            case "$CONCLUSION" in
              success)
                state=success
                description="CI concluded success"
                ;;
              cancelled)
                echo "CI run was cancelled; the superseding run posts the status."
                exit 0
                ;;
              *)
                state=failure
                description="CI concluded ${CONCLUSION:-unknown}"
                ;;
            esac
          fi
          gh api --method POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context=credentialed-acctests \
            -f description="$description" \
            -f target_url="$RUN_URL" >/dev/null
          echo "Posted credentialed-acctests=${state} on ${HEAD_SHA}."
