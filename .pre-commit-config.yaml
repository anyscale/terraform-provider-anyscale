# Pre-commit hooks for Terraform Provider
#
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

# Installs the pre-commit AND commit-msg hook types by default, so the
# internal-terminology message gate below is installed without needing
# `pre-commit install --hook-types commit-msg`.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=500']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: detect-private-key
        name: Detect private keys

  - repo: local
    hooks:
      - id: check-internal-terminology
        # Checks the commit message only; the tracked-file tree check runs
        # in CI (.github/workflows/internal-terminology.yml), where the
        # merge-base script and denylist cannot be edited by the PR being
        # judged. Lines found here are fixed by rephrasing - git history is
        # immutable without a force-push, so amend and reword.
        # --git-commit-msg, not --message-file: git hands the hook the
        # UNCLEANED message, whose "# On branch ..." template line and
        # `git commit -v` scissors+diff would false-positive. The mode
        # applies git's own cleanup before checking.
        name: internal terminology (commit message)
        entry: bash .github/scripts/check-internal-terminology.sh --git-commit-msg
        language: system
        stages: [commit-msg]
        always_run: true
      - id: gofmt
        name: gofmt
        entry: go fmt ./...
        language: system
        pass_filenames: false
        files: "^(.*).go$"
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        pass_filenames: false
        files: "^(.*).go$"
      - id: provider-docs
        name: provider-doc
        entry: make docs
        language: system
        pass_filenames: false
        files: "^(.*).go$"

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2  # match ci.yml's v2.13.2 pin; older revs panic under go 1.26
    hooks:
      - id: golangci-lint
        # Optional: run on all files (CI) instead of just staged
        args: [--timeout=5m]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.4
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_docs
        args:
          - --args=--config=.terraform-docs.yml
